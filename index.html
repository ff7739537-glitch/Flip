<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLIP — Social. Live. Play. Connect.</title>
    <meta name="description" content="FLIP is a social platform for live streams, reels, games, chat and rewards." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLIP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:title" content="FLIP — Social. Live. Play. Connect." />
    <meta property="og:description" content="Live streams, reels, games, chat and rewards in one app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      #fallback {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 1rem;
      }
      #fallback .inner {
        text-align: center;
        max-width: 400px;
      }
      #fallback h1 {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -0.05em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #34d399, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #fallback p {
        color: #94a3b8;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }
      #fallback button {
        background: #10b981;
        color: white;
        border: none;
        padding: 0.625rem 1.75rem;
        border-radius: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.875rem;
      }
      #fallback button:hover { background: #34d399; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback">
      <div class="inner">
        <h1>FLIP</h1>
        <p>The app is loading. If this persists, please refresh the page.</p>
        <button onclick="location.reload()">Reload Page</button>
      </div>
    </div>
    <script>
      // Show fallback if React hasn't mounted within 8 seconds
      window.__flipFallbackTimer = setTimeout(function () {
        var root = document.getElementById('root');
        var fallback = document.getElementById('fallback');
        if (root && root.children.length === 0 && fallback) {
          fallback.style.display = 'flex';
        }
      }, 8000);

      // Hide fallback once React renders
      window.__flipClearFallback = function () {
        clearTimeout(window.__flipFallbackTimer);
        var fallback = document.getElementById('fallback');
        if (fallback) fallback.style.display = 'none';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
